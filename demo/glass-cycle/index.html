<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keep — glass cycle</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/Fraunces-Regular.ttf") format("truetype"); font-weight: 300 700; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
  html, body { margin: 0; background: #1a1010; }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; }
  #transport { display: flex; gap: 12px; align-items: center; padding: 10px 14px; color: #f4efe4; font: 13px system-ui; }
  #transport button { font: 13px system-ui; padding: 4px 14px; }
  #scrub { flex: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="transport">
  <button id="play">play / pause</button>
  <input id="scrub" type="range" min="0" max="10" step="0.0167" value="0" />
  <span id="timelabel">0.00s</span>
</div>
<script src="./dist/main.js?v=glass1"></script>
</body>
</html>

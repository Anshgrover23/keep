name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          for app in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Need Xcode 26 on this runner" >&2
          ls /Applications/Xcode*.app
          exit 1
      - name: Test
        run: xcodebuild -project Keep.xcodeproj -scheme Keep -configuration Debug -derivedDataPath build/DerivedData -destination 'platform=macOS' test

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          for app in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode_26.1.1.app /Applications/Xcode_26.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Need Xcode 26 on this runner" >&2
          ls /Applications/Xcode*.app
          exit 1
      - name: Release build
        run: xcodebuild -project Keep.xcodeproj -scheme Keep -configuration Release -derivedDataPath build/DerivedData -destination 'platform=macOS' build

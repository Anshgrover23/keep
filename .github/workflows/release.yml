name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Need Xcode 16 on this runner" >&2
          ls /Applications/Xcode*.app
          exit 1

      - name: Read version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be semver with a v prefix, for example v1.0.0" >&2
            exit 1
          fi
          echo "KEEP_TAG=$TAG" >> "$GITHUB_ENV"
          echo "KEEP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Test
        run: |
          xcodebuild -project Keep.xcodeproj -scheme Keep -configuration Debug \
            -derivedDataPath build/DerivedData -destination 'platform=macOS,arch=arm64' test

      - name: Release build
        run: |
          xcodebuild -project Keep.xcodeproj -scheme Keep -configuration Release \
            -derivedDataPath build/DerivedData -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY="-" build

      - name: Check version and arch
        run: |
          APP="build/DerivedData/Build/Products/Release/Keep.app"
          PLIST="$APP/Contents/Info.plist"
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          if [[ "$SHORT" != "$KEEP_VERSION" ]]; then
            echo "CFBundleShortVersionString is $SHORT, tag is $KEEP_VERSION" >&2
            exit 1
          fi
          lipo -info "$APP/Contents/MacOS/Keep"
          if lipo -info "$APP/Contents/MacOS/Keep" | grep -q x86_64; then
            echo "Release binary must be arm64 only" >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/Keep.app"
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/Keep.app"
          hdiutil create -volname Keep -srcfolder "$STAGE" -ov -format UDZO \
            "Keep-${KEEP_VERSION}.dmg"
          ls -lh "Keep-${KEEP_VERSION}.dmg"

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/keep-release-notes.md <<EOF
          Keep puts a living day on the Mac desktop: light, weather, and today’s Keep. A small extra stays in the menu bar.

          ## In this release

          * The sky follows the sun through the day.
          * Turn on **Use local weather** if Keep should use your location for weather and daylight.
          * The wallpaper shows at most two lines: the next Calendar event or a due reminder, and today’s Keep.
          * Calendar and location are optional. Keep still runs if you leave them off.
          * Turn off **Show Keep on the desktop** from the extra to bring the Mac picture back.
          * Sleep and lock pause the sky. **Pause in fullscreen apps** and **Pause on Low Power Mode** are off unless you turn them on in Settings.

          ## Requirements

          * macOS 14 or later
          * Apple Silicon

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Anshgrover23/keep/main/scripts/install.sh | bash
          \`\`\`

          Or download \`Keep-${KEEP_VERSION}.dmg\` below.
          EOF
          gh release create "$KEEP_TAG" "Keep-${KEEP_VERSION}.dmg" \
            --draft \
            --title "Keep ${KEEP_VERSION}" \
            --notes-file /tmp/keep-release-notes.md

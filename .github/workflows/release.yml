name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be semver with a v prefix, for example v1.0.0" >&2
            exit 1
          fi
          echo "KEEP_TAG=$TAG" >> "$GITHUB_ENV"
          echo "KEEP_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Test
        run: |
          xcodebuild -project Keep.xcodeproj -scheme Keep -configuration Debug \
            -derivedDataPath build/DerivedData -destination 'platform=macOS,arch=arm64' test

      - name: Release build
        run: |
          xcodebuild -project Keep.xcodeproj -scheme Keep -configuration Release \
            -derivedDataPath build/DerivedData -destination 'platform=macOS,arch=arm64' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY="-" build

      - name: Check version and arch
        run: |
          APP="build/DerivedData/Build/Products/Release/Keep.app"
          PLIST="$APP/Contents/Info.plist"
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          if [[ "$SHORT" != "$KEEP_VERSION" ]]; then
            echo "CFBundleShortVersionString is $SHORT, tag is $KEEP_VERSION" >&2
            exit 1
          fi
          lipo -info "$APP/Contents/MacOS/Keep"
          if lipo -info "$APP/Contents/MacOS/Keep" | grep -q x86_64; then
            echo "Release binary must be arm64 only" >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          APP="build/DerivedData/Build/Products/Release/Keep.app"
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/Keep.app"
          hdiutil create -volname Keep -srcfolder "$STAGE" -ov -format UDZO \
            "Keep-${KEEP_VERSION}.dmg"
          ls -lh "Keep-${KEEP_VERSION}.dmg"

      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/keep-release-notes.md <<EOF
          Keep ${KEEP_VERSION} for macOS 14 on Apple Silicon.

          Install after this draft is published:

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/Anshgrover23/keep/main/scripts/install.sh | bash
          \`\`\`

          The DMG is attached here. The app is ad hoc signed. Apple did not notarize it. The install script copies Keep.app into Applications and clears quarantine.

          This Release starts as a draft. The install script uses the latest published Release, so publish before sharing the curl line.
          EOF
          gh release create "$KEEP_TAG" "Keep-${KEEP_VERSION}.dmg" \
            --draft \
            --title "$KEEP_TAG" \
            --notes-file /tmp/keep-release-notes.md
